# Zeitgauge needs catalogue: what people need, and the signals that show it.
#
# Each need lists its drivers: the signals that make it more pressing.
#   signal = a monthly signal id (config/regions/<region>.toml)
#   pulse  = a daily pulse signal id (config/pulse/<region>.toml); "social_*" matches any social platform
#   when   = "worse" if the need grows when that signal is bad for households,
#            "better" if it grows when the signal is good
#   weight = how much that signal counts towards this need
# Ids that a region doesn't have are skipped, so one catalogue covers the UK
# and the US (umich stands in for gfk, and so on).
#
# phases / overlay: where the need fits the playbook (playbook.py). A fit adds
# a small bonus, and a need whose phases include the *next* phase is marked as
# still working when the cycle turns.
#
# alerts: alert watch ids (config/pulse/<region>.toml) that make the need more
# pressing when they fire during the week.
#
# check: a measurable proxy, so every idea we put forward becomes a dated call
# that is checked 13 weeks later (Google Trends interest for these searches).
#
# Ideas: name, format (physical, digital, service or content), a rough price
# band and the cheapest way to test demand. Prices are UK examples.

[[needs]]
id = "money_control"
name = "Money control"
feeling = "Help people feel in charge of their money."
phases = ["slowdown", "downturn"]
drivers = [
  { signal = "gfk_pfin", when = "worse", weight = 1.5 },
  { signal = "umich", when = "worse", weight = 1.0 },
  { signal = "dd_failure", when = "worse", weight = 1.0 },
  { signal = "card_delinquency", when = "worse", weight = 1.0 },
  { signal = "real_pay", when = "worse", weight = 1.0 },
  { signal = "cpi", when = "worse", weight = 0.75 },
  { pulse = "news_squeeze", when = "worse", weight = 0.75 },
  { pulse = "wiki_worry", when = "worse", weight = 0.5 },
  { pulse = "search_hardship", when = "worse", weight = 0.75 },
  { pulse = "social_*", when = "worse", weight = 0.5 },
]
alerts = ["prices", "budget"]
check = { searches = ["budget planner", "money saving tips"] }
ideas = [
  { name = "Printable and spreadsheet budget planners for couples and house shares", format = "digital", price = "£4 to £12", test = "Three Etsy listings with different covers; count sales in 14 days" },
  { name = "A weekly 'cheaper swaps' newsletter or short-video series", format = "content", price = "free, with affiliate links", test = "Ten short videos in two weeks; watch saves and follows" },
  { name = "Declutter-and-resell starter kit (labels, guide, pricing cheat sheet)", format = "physical", price = "£10 to £20", test = "Pre-order page with a £1 deposit" },
]

