[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeitgauge"
version = "0.2.0"
description = "Read the mood of a region's households and society, and turn it into product ideas that suit the moment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
trends = ["trendspyg[analysis]>=1.9"]
dev = ["pytest>=8"]

[project.scripts]
zeitgauge = "zeitgauge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
